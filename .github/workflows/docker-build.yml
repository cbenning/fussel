name: Docker build check

# Builds the image without pushing it, so Dockerfile or dependency changes
# that break the image are caught before a release. Release pushes are in docker.yml.
on:
  pull_request:
    paths:
      - docker/**
      - pyproject.toml
      - uv.lock
      - Makefile
      - fussel/web/package.json
      - fussel/web/yarn.lock
      - .github/workflows/docker-build.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
