name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version from the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$TAG' is not a version like 3.3.0 or v3.3.0" >&2
            exit 1
          fi
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          grep '^version = ' pyproject.toml

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: fussel/web/yarn.lock

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
        working-directory: fussel/web

      - name: Build web app
        run: make build-web

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test the wheel
        run: scripts/smoke_test_wheel.sh dist/*.whl

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
