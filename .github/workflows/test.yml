name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

  python-tests:
    # 3.14 matches the Docker image (alpine:latest), which is how most people run
    # Fussel. 3.11 is the oldest version pyproject.toml allows for the PyPI package.
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v --cov=fussel --cov-report=term

  js-tests:
    name: JS tests (Node 24)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: fussel/web/yarn.lock

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
        working-directory: fussel/web

      - name: Run JS tests
        run: yarn test
        working-directory: fussel/web

      - name: Build web app
        run: yarn build
        working-directory: fussel/web

  package:
    name: Package (build and smoke test the wheel)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: fussel/web/yarn.lock

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
        working-directory: fussel/web

      - name: Build web app
        run: make build-web

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test the wheel
        run: scripts/smoke_test_wheel.sh dist/*.whl
