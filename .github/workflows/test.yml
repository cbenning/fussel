name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

  python-tests:
    # Keep in step with the Python and Node versions in the Docker image (alpine:latest),
    # which is how Fussel is shipped.
    name: Python tests (3.14)
    runs-on: ubuntu-latest
    needs: lint
    env:
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v --cov=fussel --cov-report=term

  js-tests:
    name: JS tests (Node 24)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: fussel/web/yarn.lock

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile
        working-directory: fussel/web

      - name: Create gallery data stubs
        run: |
          mkdir -p fussel/web/src/_gallery
          echo 'export const albums_data = {};' > fussel/web/src/_gallery/albums_data.js
          echo 'export const people_data = {};' > fussel/web/src/_gallery/people_data.js
          echo 'export const photos_data = [];' > fussel/web/src/_gallery/photos_data.js
          printf 'export const site_data = { site_name: "", people_enabled: false, albums_enabled: false, photos_enabled: false };\n' > fussel/web/src/_gallery/site_data.js

      - name: Run JS tests
        run: yarn test
        working-directory: fussel/web

      - name: Build web app
        run: yarn build
        working-directory: fussel/web
